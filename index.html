<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Viewer</title>
<script>
/* ============================================================
   EDITABLE TEXT & SETTINGS
   ============================================================ */
const INSTRUCTIONS =
  "You'll see a series of objects. Keep the ones you'd want to look at more. " +
  "Skip the rest. There's no right answer and you don't need to explain anything. " +
  "Go at whatever pace feels natural.";
const KEY_HINT = "Use the buttons, or the arrow keys: ← skip, → keep.";
const REPLAY_INTRO = "Now I'd like to go back over some of those with you.";
const THANKS = "Thank you — that's everything.";

const CATALOGUE_URL = "catalogue.json";
const REPLAY_MIN_VIEW_MS = 8000;   // forced-engagement time before controls appear
const REPLAY_KEPT_COUNT = 3;       // kept items mixed into replay as comparison
const REASON_PROMPT = "What went through your mind when you saw this?";
const PLEASURE_LABEL = "How much do you like it?";
const INTEREST_LABEL = "How much does it make you want to keep looking?";
const SCALE_LOW = "not at all";
const SCALE_HIGH = "very much";
const REVERSE_LABEL = "Looking at it now, I'd have kept this.";

// Phase 3: re-browse with flicker. Each item and its "prime" image (catalogue.json)
// alternate continuously until the participant chooses keep or skip.
const REBROWSE_INTRO = "One more round. Keep or skip, same as before.";
const FLICKER_MS = 400;            // time each image stays up before switching.
                                   // Keep >= 170 ms: faster than ~3 flashes/s risks photosensitive seizures.

// Dissection end parts (shown / guided / free). Run over the participant's skipped items;
// after the activity they choose keep or skip again.
const DISSECT_INTRO = {
  shown:  "Let's look again at some of the ones you skipped, taken apart into their elements.",
  guided: "Let's look again at some of the ones you skipped, one part at a time.",
  free:   "Let's look again at some of the ones you skipped.",
  refs:   "Let's look again at some of the ones you skipped, one part at a time. As you circle a part, related images will appear."
};
const DISSECT_PROMPT = {
  shown:  "",
  guided: "Draw around it with your mouse. You can skip any question.",
  free:   "Find one detail you didn't notice the first time. Drag a circle onto it and write what it is.",
  refs:   "Draw around it with your mouse. You can skip any question."
};
const REFS_COUNT = 8;              // references found per circled part (live search, ranked by CLIP)
const REFS_HEADING = "Reads like";
const DISSECT_DECIDE_PROMPT = "Keep or skip?";
// "Dissection – you label it": asked one at a time; the participant circles the part with the mouse.
const GUIDED_QUESTIONS = [
  { key: "unnoticed",  label: "Didn't notice",    side: "left",
    question: "Circle something you didn't notice the first time" },
  { key: "put_off",    label: "Put me off",       side: "right",
    question: "Circle the part that put you off" },
  { key: "admirers",   label: "Others would love", side: "right",
    question: "Circle the part people who like it would appreciate most" }
];
const DISSECT_MIN_VIEW_MS = 3000;  // "shown": time before Done appears
const LENS_ZOOM = 2.5;             // magnification inside the spheres
const FREE_SPHERES = 3;            // number of spheres in "find a detail"

// Timing summary + on-screen timer
const GLANCE_MS = 1000;            // decisions faster than this count as "glance"
const LINGER_MS = 3000;            // decisions slower than this count as "lingered"
// Defaults for the Settings panel (gear, top-left of the start screen).
// Changes made in the panel are remembered in this browser.
const DEFAULT_SETTINGS = {
  endPart: "off",                  // key into END_PARTS (defined further down)
  itemCount: 0,                    // items per session, drawn at random; 0 = all
  showTimer: true,                 // elapsed-time clock in the top-right corner
  debug: true                      // "next page" button bottom-left. Turn off for real participants.
};
</script>
<style>
  :root {
    --bg: #8a8a8a;         /* neutral mid-grey: no colour cast on the objects */
    --box: #ececec;        /* letterbox fill: light, to sit close to the museum-photo backgrounds */
    --ink: #111;
    --btn: #d6d6d6;
    --btn-ink: #111;
    --box-w: min(88vw, 68vh, 900px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .screen { display: none; width: 100%; min-height: 100%; padding: 24px 16px;
            flex-direction: column; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  .panel { max-width: 560px; width: 100%; }
  .panel p { margin: 0 0 1em; }
  .hint { opacity: .75; font-size: 15px; }
  label.field { display: block; margin: 1.2em 0 .3em; font-size: 15px; }
  input[type=text] { font: inherit; padding: 8px 10px; width: 100%; border: 1px solid #555;
                     border-radius: 4px; background: #eee; }

  /* Identical, flat buttons. No hover/active styling that could favour one action. */
  button {
    font: inherit; font-size: 17px; width: 140px; padding: 12px 0;
    background: var(--btn); color: var(--btn-ink);
    border: 1px solid #555; border-radius: 4px; cursor: pointer;
    transition: none;
  }
  button:hover, button:active, button:focus { background: var(--btn); color: var(--btn-ink); }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid #222; outline-offset: 2px; }

  /* Normalised display box, identical in browse and replay. */
  .stage {
    width: var(--box-w); aspect-ratio: 1 / 1;
    background: var(--box);
    position: relative; overflow: hidden;
  }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%;
               object-fit: contain; display: block; background: var(--box); }

  .actions { display: flex; gap: 24px; margin-top: 24px; }

  /* Replay */
  #replay-wait { margin-top: 20px; width: 10px; height: 10px; border-radius: 50%;
                 background: #555; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .15; } 50% { opacity: .6; } }
  #replay-controls { width: var(--box-w); margin-top: 16px; display: none;
                     opacity: 0; transition: opacity 150ms linear; }
  #replay-controls.shown { display: block; }
  #replay-controls.visible { opacity: 1; }
  #replay-controls textarea { font: inherit; width: 100%; height: 70px; padding: 8px 10px;
                              border: 1px solid #555; border-radius: 4px; background: #eee; resize: vertical; }
  .scale { margin-top: 12px; }
  .scale .q { font-size: 15px; margin-bottom: 2px; }
  .scale .row { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .9; }
  .scale input[type=range] { flex: 1; }
  .rev { margin-top: 12px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .next-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  #replay .stage { width: min(var(--box-w), 46vh); }
  #replay-controls { width: min(var(--box-w), 720px); }

  #load-error { display: none; margin-top: 1em; font-size: 15px; }

  /* Dissection */
  #dissect { justify-content: flex-start; padding-top: 44px; }
  .dissect-prompt { margin: 0 0 12px; text-align: center; max-width: 760px; min-height: 1.5em; }
  #collage { position: relative; display: grid; grid-template-columns: 1fr auto 1fr;
             gap: 0 min(4vw, 56px); align-items: center; width: min(96vw, 1200px);
             --tile: min(26vh, 210px); --sph: 84px; }
  #collage .col { display: flex; flex-direction: column; gap: 22px; }
  #col-left { align-items: flex-end; } #col-right { align-items: flex-start; }
  #collage .center { display: flex; flex-direction: column; align-items: center; }
  #dissect-stage { width: min(56vh, 40vw); }
  #collage.shown #dissect-stage { width: min(64vh, 44vw); }
  #collage.guided #dissect-stage { width: min(60vh, 44vw); cursor: crosshair; touch-action: none; }
  #collage.guided #tray { display: none; }
  #lasso-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  #lasso-panel { display: none; width: min(92vw, 620px); margin-top: 14px; }
  #lasso-panel.on { display: block; }
  #lasso-ask { text-align: center; margin-bottom: 10px; }
  #lasso-controls { display: flex; gap: 10px; align-items: center; }
  #lasso-controls input { flex: 1; font-size: 15px; }
  #lasso-controls button { width: auto; padding: 10px 18px; }
  #collage.refs #dissect-stage { width: min(50vh, 40vw); }
  #ref-strip { display: none; margin-top: 12px; }
  #ref-strip.on { display: block; }
  #ref-strip .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; margin-bottom: 8px; }
  #ref-strip .head > span { opacity: .75; margin-right: 2px; }
  .chip { width: auto; padding: 3px 10px; font-size: 13px; border-radius: 999px; background: #e6e6e6; }
  #ref-list { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; min-height: 30px; }
  .ref { width: 100%; padding: 0; border: 1px solid #555; border-radius: 3px; overflow: hidden; background: #ccc; }
  .ref img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  #ref-status { font-size: 13px; opacity: .7; margin-top: 6px; }

  /* Full-screen explorer, Land Lines style: the reference fills the screen, your part sits on it. */
  #explore { position: fixed; inset: 0; z-index: 30; background: #000; color: #f2f2f2; }
  #explore[hidden] { display: none; }
  #explore .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                 transition: opacity 350ms linear; }
  #explore .shade { position: absolute; inset: 0; pointer-events: none;
                    background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 22%, transparent 70%, rgba(0,0,0,.6)); }
  #explore .top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px;
                  flex-wrap: wrap; align-items: center; font-size: 14px; }
  #explore .top .chip { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.5); }
  #explore .top .chip.on { background: #fbe36b; color: #111; border-color: #fbe36b; }
  #explore .part { position: absolute; left: 24px; bottom: 24px; width: min(26vh, 220px); text-align: center;
                   font-size: 12px; letter-spacing: .06em; }
  #explore .part canvas { width: 100%; display: block; filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  #explore .cap { position: absolute; right: 24px; bottom: 24px; max-width: 46vw; text-align: right; font-size: 13px; }
  #explore .cap b { display: block; font-size: 16px; font-weight: 600; }
  #explore .cap .lic { opacity: .7; font-size: 11px; margin-top: 2px; }
  #explore .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; padding: 0;
                  border-radius: 50%; font-size: 26px; background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.6); }
  #explore .nav:hover, #explore .nav:focus { background: rgba(0,0,0,.35); color: #fff; }
  #explore .prev { left: 16px; } #explore .next { right: 16px; }
  #explore .back { position: absolute; top: 14px; right: 16px; width: auto; padding: 6px 14px; font-size: 14px; }
  #explore .count { opacity: .7; margin-top: 6px; font-size: 12px; }
  #ref-ready { font-size: 14px; opacity: .75; margin-top: 10px; min-height: 1.4em; }
  .q-step { display: block; font-size: 13px; opacity: .7; letter-spacing: .06em; }
  .q-text { display: block; font-size: 20px; margin-top: 2px; }
  #tray { width: 100%; height: 118px; }
  #collage.shown #tray { display: none; }
  .tile { width: var(--tile); opacity: 0; transition: opacity 300ms linear; }
  .tile.on { opacity: 1; }
  .tile canvas { width: var(--tile); height: var(--tile); display: block;
                 background: #f4f4f4; border: 1px solid #555; }
  .tile.empty canvas { background: transparent; border-style: dashed; }
  .tile .txt { font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; margin-top: 3px; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
           overflow: visible; z-index: 4; }
  #links line, #links circle { stroke: #1a1a1a; stroke-width: 1.2; fill: none;
                               transition: opacity 300ms linear; }
  #links .dot { fill: #1a1a1a; stroke: none; }
  .sphere { position: absolute; width: var(--sph); height: var(--sph); border-radius: 50%;
            margin: calc(var(--sph) / -2) 0 0 calc(var(--sph) / -2); z-index: 5;
            cursor: grab; touch-action: none; user-select: none;
            background: radial-gradient(circle at 35% 30%, #fff, #c4c4c4 58%, #8f8f8f);
            box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.85); }
  .sphere.dragging { cursor: grabbing; }
  /* Once dropped on the object a sphere contracts to a small marker; the detail shows in its tile. */
  .sphere.placed:not(.dragging) { width: 24px; height: 24px; margin: -12px 0 0 -12px;
                                  background: #fbe36b; border: 2px solid #1a1a1a;
                                  box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .sphere.placed:not(.dragging) .lbl { display: none; }
  .sphere.sel { outline: 3px solid #fbe36b; outline-offset: 2px; }
  .sphere .lbl { position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
                 margin-top: 5px; font-size: 12px; white-space: nowrap; background: #eee;
                 padding: 0 6px; border-radius: 3px; pointer-events: none; }
  #collage.locked .sphere { pointer-events: none; cursor: default; }
  #sphere-pop { position: absolute; z-index: 6; width: 230px; }
  #sphere-pop[hidden] { display: none; }
  #sphere-pop { display: flex; gap: 6px; width: 330px; }
  #sphere-pop input { font-size: 15px; padding: 6px 8px; flex: 1; }
  #sphere-pop button { width: auto; padding: 4px 10px; font-size: 13px; }

  #timer { position: fixed; top: 12px; right: 16px; font-size: 13px;
           font-variant-numeric: tabular-nums; opacity: .55; display: none; }
  #debug-bar { position: fixed; bottom: 12px; left: 16px; display: none; gap: 8px; z-index: 10; }
  #debug-bar button { width: auto; padding: 6px 12px; font-size: 13px; background: #fbe36b; }
  #debug-bar button:hover, #debug-bar button:active, #debug-bar button:focus { background: #fbe36b; }
  #settings-btn { position: fixed; top: 12px; left: 16px; width: auto; padding: 6px 12px;
                  font-size: 13px; z-index: 10; }
  #settings-panel { position: fixed; top: 48px; left: 16px; z-index: 10; width: 320px;
                    background: #e6e6e6; border: 1px solid #555; border-radius: 4px;
                    padding: 12px 14px; font-size: 14px; }
  #settings-panel[hidden] { display: none; }
  .set-row { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px;
             align-items: center; margin-bottom: 10px; }
  .set-row select, .set-row input { font: inherit; padding: 3px 4px; width: 100%; }
  .set-note { grid-column: 1 / -1; font-size: 12px; opacity: .7; }
  .set-check { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
</style>
</head>
<body>
<div id="timer">0:00</div>
<div id="debug-bar">
  <button id="debug-skip">DEBUG: next page ⏭</button>
  <button id="debug-stage">DEBUG: skip stage ⏭⏭</button>
</div>
<button id="settings-btn" aria-label="Settings">⚙ Settings</button>
<div id="settings-panel" hidden>
  <div class="set-row">
    <label for="set-end">End part</label>
    <select id="set-end"></select>
  </div>
  <div class="set-row">
    <label for="set-count">Items per session</label>
    <input type="number" id="set-count" min="0" step="1">
    <span class="set-note" id="set-count-note"></span>
  </div>
  <label class="set-check"><input type="checkbox" id="set-timer"> Show timer</label>
  <label class="set-check"><input type="checkbox" id="set-debug"> Debug "next page" button</label>
</div>

<!-- 1. START -->
<section id="start" class="screen active">
  <div class="panel">
    <p id="instructions"></p>
    <p class="hint" id="key-hint"></p>
    <label class="field" for="pid">Participant ID (leave blank to auto-generate)</label>
    <input type="text" id="pid" autocomplete="off" spellcheck="false">
    <div id="load-error">
      <p>Couldn't load <code>catalogue.json</code> automatically (browsers block this when opening

      <input type="file" id="cat-file" accept=".json,application/json">
    </div>
    <div class="actions"><button id="start-btn" disabled>Loading…</button></div>
  </div>
</section>

<!-- 2. BROWSE -->
<section id="browse" class="screen">
  <div class="stage" id="browse-stage"></div>
  <div class="actions">
    <button id="skip-btn">Skip</button>
    <button id="keep-btn">Keep</button>
  </div>
</section>

<!-- 3a. REPLAY INTRO -->
<section id="replay-intro" class="screen">
  <div class="panel">
    <p id="replay-intro-text"></p>
    <div class="actions"><button id="replay-go">Continue</button></div>
  </div>
</section>

<!-- 3b. REPLAY -->
<section id="replay" class="screen">
  <div class="stage" id="replay-stage"></div>
  <div id="replay-wait"></div>
  <div id="replay-controls">
    <label class="field" for="reason" id="reason-label" style="margin-top:0"></label>
    <textarea id="reason"></textarea>
    <div class="scale">
      <div class="q" id="pleasure-label"></div>
      <div class="row"><span class="lo"></span><input type="range" id="pleasure" min="0" max="100" step="1"><span class="hi"></span></div>
    </div>
    <div class="scale">
      <div class="q" id="interest-label"></div>
      <div class="row"><span class="lo"></span><input type="range" id="interest" min="0" max="100" step="1"><span class="hi"></span></div>
    </div>
    <label class="rev"><input type="checkbox" id="reversed"><span id="reverse-label"></span></label>
    <div class="next-row"><button id="replay-next">Next</button></div>
  </div>
</section>

<!-- 3c. RE-BROWSE INTRO (re-browse itself reuses the browse screen) -->
<section id="rebrowse-intro" class="screen">
  <div class="panel">
    <p id="rebrowse-intro-text"></p>
    <div class="actions"><button id="rebrowse-go">Continue</button></div>
  </div>
</section>

<!-- 3d. DISSECTION (three versions, chosen in Settings) -->
<section id="dissect-intro" class="screen">
  <div class="panel">
    <p id="dissect-intro-text"></p>
    <div class="actions"><button id="dissect-go">Continue</button></div>
    <div id="ref-ready"></div>
  </div>
</section>
<section id="dissect" class="screen">
  <p class="dissect-prompt" id="dissect-prompt"></p>
  <div id="collage">
    <div class="col" id="col-left"></div>
    <div class="center">
      <div class="stage" id="dissect-stage"></div>
      <div id="tray"></div>
    </div>
    <div class="col" id="col-right"></div>
    <svg id="links"></svg>
    <div id="sphere-pop" hidden>
      <input type="text" id="sphere-text" autocomplete="off">
      <button id="sphere-remove" type="button">Remove</button>
    </div>
  </div>
  <div id="lasso-panel">
    <div id="lasso-ask"></div>
    <div id="lasso-controls">
      <input type="text" id="lasso-text" autocomplete="off" placeholder="A few words">

      <button id="lasso-next" type="button">Next</button>

    <div id="ref-strip">
      <div class="head" id="ref-head"></div>
      <div id="ref-list"></div>
      <div id="ref-status"></div>
    </div>
  </div>
  <div class="actions">
    <button id="dissect-done">Done</button>
    <button id="dissect-skip" hidden>Skip</button>
    <button id="dissect-keep" hidden>Keep</button>

<div id="explore" hidden>
  <img class="bg" id="ex-a" alt=""><img class="bg" id="ex-b" alt="">
  <div class="shade"></div>
  <div class="top" id="ex-words"></div>
  <button class="back" id="ex-back" type="button">Back to the object</button>
  <button class="nav prev" id="ex-prev" type="button" aria-label="Previous">‹</button>
  <button class="nav next" id="ex-next" type="button" aria-label="Next">›</button>
  <div class="part"><canvas id="ex-part"></canvas><div>your part</div></div>
  <div class="cap"><b id="ex-title"></b><span id="ex-meta"></span><div class="lic" id="ex-lic"></div><div class="count" id="ex-count"></div></div>

<section id="end" class="screen">

    <p id="thanks"></p>
    <div class="actions"><button id="download-btn" style="width:auto;padding:12px 20px">Download data</button></div>
    <p class="hint" id="saved-note" style="margin-top:1em"></p>
  </div>
</section>

<script src="vision.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
const $ = id => document.getElementById(id);
const nowISO = () => new Date().toISOString();

let catalogue = null;        // { version?, items: [...] }
let catalogueVersion = "";
let itemsById = {};
let participantId = "";
let phase = "start";         // start | browse | replay | rebrowse | dissect | end

const data = {
  participant_id: "",
  started_at: null,
  finished_at: null,
  catalogue_version: "",
  browse_started_at: null,
  browse_finished_at: null,
  total_browse_ms: null,
  browse: [],
  replay: [],
  rebrowse_started_at: null,
  rebrowse_finished_at: null,
  prime_settings: { flicker_ms: FLICKER_MS, starts_with: "item" },
  rebrowse: [],
  focus_events: [],
  environment: {}
};

/* ============================================================
   UTILITIES
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hashString(s) {               // short stable hash, used if catalogue has no "version"
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return "hash-" + h.toString(16);
}
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function tagsOf(id) {                  // deep copy so the export is self-contained
  return JSON.parse(JSON.stringify((itemsById[id] && itemsById[id].tags) || {}));
}
// Resolves on the first animation frame after the DOM change, i.e. when the image is being painted.
function nextPaint() {
  return new Promise(res => requestAnimationFrame(() => res(performance.now())));
}

/* Image preloading: each item gets one Image element, loaded and decoded before display. */
const imgCache = {};
function preload(item) {
  if (!imgCache[item.id]) {
    const img = new Image();
    img.alt = "";
    img.draggable = false;
    const p = new Promise((resolve, reject) => {
      img.onload = () => {
        const loadedAt = performance.now();
        // decode() can stall while the tab is hidden; don't wait on it for more than 1.5 s.
        const decoded = img.decode ? img.decode().catch(() => {}) : Promise.resolve();
        Promise.race([decoded, new Promise(r => setTimeout(r, 1500))])
          .then(() => resolve({ img, loadedAt }));
      };
      img.onerror = () => reject(new Error("Image failed to load: " + item.image));
    });
    img.src = item.image;
    imgCache[item.id] = p;
  }
  return imgCache[item.id];
}

/* ============================================================
   FOCUS / VISIBILITY LOGGING (whole session)
   ============================================================ */
function logFocus(type) {
  if (phase === "start" || phase === "end") return;
  data.focus_events.push({
    type,
    timestamp: nowISO(),
    phase,
    position: phase === "browse" ? browseIndex : phase === "replay" ? replayIndex :
              phase === "dissect" ? dx.index : rebrowseIndex
  });
}
window.addEventListener("blur", () => logFocus("blur"));
window.addEventListener("focus", () => logFocus("focus"));
document.addEventListener("visibilitychange", () =>
  logFocus(document.hidden ? "hidden" : "visible"));

function acceptCatalogue(text) {

/* ============================================================
   TIMING: phase durations, on-screen timer, button hover ("lingering")
   ============================================================ */
const perf = { session: 0, browse: [0, 0], replay: [0, 0], rebrowse: [0, 0], dissect: [0, 0] };
let timerInterval = null;

function startTimer() {
  if (!settings.showTimer) return;
  $("timer").style.display = "block";
  const tick = () => {
    const s = Math.floor((performance.now() - perf.session) / 1000);
    $("timer").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  tick();
  timerInterval = setInterval(tick, 250);
}

function speedOf(ms) {
  return ms < GLANCE_MS ? "glance" : ms >= LINGER_MS ? "lingered" : "normal";
}

// Pointer time over each button while an item is up: hesitation between Skip and Keep.
let hover = null;
function resetHover() {
  hover = { skip: 0, keep: 0, switches: 0, first: null, last: null, over: null, since: 0 };
  // Pointer may already rest on a button when the item appears (pointerenter won't refire).
  ["skip", "keep"].forEach(w => { if ($(w + "-btn").matches(":hover")) hoverEnter(w); });
}
function hoverEnter(which) {
  if (!hover) return;
  if (hover.first === null) hover.first = which;
  else if (hover.last && hover.last !== which) hover.switches++;
  hover.over = which; hover.last = which; hover.since = performance.now();
}
function hoverLeave() {
  if (!hover || !hover.over) return;
  hover[hover.over] += performance.now() - hover.since;
  hover.over = null;
}
function hoverResult() {
  hoverLeave();
  const r = { hover_skip_ms: Math.round(hover.skip), hover_keep_ms: Math.round(hover.keep),
              hover_switches: hover.switches, first_hover: hover.first };
  resetHover();
  return r;
}
["skip", "keep"].forEach(w => {
  $(w + "-btn").addEventListener("pointerenter", () => hoverEnter(w));
  $(w + "-btn").addEventListener("pointerleave", hoverLeave);
});

$("start-btn").addEventListener("click", () => {
  if (!catalogue) return;
  perf.session = performance.now();
  startTimer();
  participantId = ($("pid").value.trim() || makeId()).replace(/[^\w.-]+/g, "_");
  data.participant_id = participantId;
  data.catalogue_version = catalogueVersion;
  data.started_at = nowISO();
  data.settings = { ...settings };
  $("settings-btn").style.display = "none";
  $("settings-panel").hidden = true;
  data.environment = {
    user_agent: navigator.userAgent,
    viewport: { w: window.innerWidth, h: window.innerHeight },
    device_pixel_ratio: window.devicePixelRatio
  };
  startBrowse();
});

/* ============================================================
   2. BROWSE
   ============================================================ */
let order = [];
let browseIndex = -1;
let browseT0 = null;           // performance.now() when current image first painted
let acceptingInput = false;
let browseStartPerf = 0;

async function startBrowse() {
  order = shuffle(catalogue.items);
  if (settings.itemCount > 0) order = order.slice(0, settings.itemCount);
  phase = "browse";
  // Kick off loading of the first two images before the screen appears.
  preload(order[0]);
  if (order[1]) preload(order[1]);
  show("browse");
  $("skip-btn").blur(); $("keep-btn").blur();
  data.browse_started_at = nowISO();
  browseStartPerf = performance.now();
  await showBrowseItem(0);
}

async function showBrowseItem(i) {
  browseIndex = i;
  acceptingInput = false;
  const stage = $("browse-stage");
  const item = order[i];
  let loaded;
  try {
    loaded = await preload(item);           // don't advance until the image is loaded + decoded
  } catch (e) {
    console.error(e);
    data.browse.push({ item_id: item.id, action: "error", error: e.message,
                       position: i, timestamp: nowISO(), tags: tagsOf(item.id) });
    return advanceBrowse();
  }
  stage.replaceChildren(loaded.img);
  if (order[i + 1]) preload(order[i + 1]);  // load the next one while this is viewed
  browseT0 = await nextPaint();             // clock starts when the image is on screen
  resetHover();
  acceptingInput = true;
}

function act(action) {
  if (phase === "rebrowse") return actRebrowse(action);
  if (phase !== "browse" || !acceptingInput) return;
  acceptingInput = false;
  const t = performance.now();
  const item = order[browseIndex];
  const dwell = Math.round(t - browseT0);
  data.browse.push({
    item_id: item.id,
    action,
    dwell_ms: dwell,
    speed: speedOf(dwell),
    ...hoverResult(),
    position: browseIndex,
    timestamp: nowISO(),
    tags: tagsOf(item.id)
  });
  advanceBrowse();
}

function advanceBrowse() {
  if (browseIndex + 1 < order.length) {
    $("browse-stage").replaceChildren();   // blank box if the next image is somehow not ready
    showBrowseItem(browseIndex + 1);
  } else {
    data.browse_finished_at = nowISO();
    data.total_browse_ms = Math.round(performance.now() - browseStartPerf);
    perf.browse = [browseStartPerf, performance.now()];
    startReplayIntro();
  }
}

$("skip-btn").addEventListener("click", e => { e.currentTarget.blur(); act("skip"); });
$("keep-btn").addEventListener("click", e => { e.currentTarget.blur(); act("keep"); });
document.addEventListener("keydown", e => {
  if (phase === "dissect" && dx.deciding && !e.repeat) {
    if (e.key === "ArrowLeft")  { e.preventDefault(); dissectDecide("skip"); }
    if (e.key === "ArrowRight") { e.preventDefault(); dissectDecide("keep"); }
    return;
  }
  if ((phase !== "browse" && phase !== "rebrowse") || e.repeat) return;
  if (e.key === "ArrowLeft")  { e.preventDefault(); act("skip"); }
  if (e.key === "ArrowRight") { e.preventDefault(); act("keep"); }
});

/* ============================================================

let replayList = [];
let replayIndex = -1;
let replayT0 = 0;
let revealTimer = null;
let moved = { pleasure: false, interest: false };

$("replay-intro-text").textContent = REPLAY_INTRO;
$("reason-label").textContent = REASON_PROMPT;

document.querySelectorAll(".scale .lo").forEach(el => el.textContent = SCALE_LOW);
document.querySelectorAll(".scale .hi").forEach(el => el.textContent = SCALE_HIGH);

/* ============================================================
   3c. RE-BROWSE WITH FLICKERED PRIMES
   Same items as browse, new random order. Each item and its prime
   (same-numbered bridge) alternate every FLICKER_MS, starting with the item,
   until the participant chooses keep or skip.
   ============================================================ */
let rebrowseOrder = [];
let rebrowseIndex = -1;
let rebrowseT0 = 0;
let flicker = null;            // { token, itemMs, primeMs, switches, showing }

$("rebrowse-intro-text").textContent = REBROWSE_INTRO;

function preloadPair(item) {
  return Promise.all([preload(item), item.prime ? preload(item.prime) : null]);
}

function startRebrowseIntro() {
  phase = "rebrowse";
  const shown = new Set(data.browse.filter(b => b.action !== "error").map(b => b.item_id));
  rebrowseOrder = shuffle(catalogue.items.filter(it => shown.has(it.id)));
  if (!rebrowseOrder.length) return finish();
  preloadPair(rebrowseOrder[0]);
  if (rebrowseOrder[1]) preloadPair(rebrowseOrder[1]);
  show("rebrowse-intro");
  $("rebrowse-go").focus();
}
$("rebrowse-go").addEventListener("click", e => {
  e.currentTarget.blur();
  show("browse");
  data.rebrowse_started_at = nowISO();
  perf.rebrowse[0] = performance.now();
  showRebrowseItem(0);
});

// Alternates item and prime on animation frames until stopFlicker() is called.
function startFlicker(itemImg, primeImg, t0) {
  const f = { itemMs: 0, primeMs: 0, switches: 0, showing: "item", since: t0, stopped: false };
  const tick = now => {
    if (f.stopped) return;
    if (now - f.since >= FLICKER_MS) {
      f[f.showing + "Ms"] += now - f.since;
      f.showing = f.showing === "item" ? "prime" : "item";
      itemImg.style.visibility = f.showing === "item" ? "visible" : "hidden";
      f.switches++;
      f.since = now;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return f;
}
function stopFlicker(t) {
  if (!flicker) return null;
  const f = flicker;
  f.stopped = true;
  f[f.showing + "Ms"] += t - f.since;
  flicker = null;
  return f;
}

async function showRebrowseItem(i) {
  rebrowseIndex = i;
  acceptingInput = false;
  const item = rebrowseOrder[i];
  const stage = $("browse-stage");
  let itemImg, primeImg = null;
  try {
    const [a, b] = await preloadPair(item);
    itemImg = a.img;
    if (b) primeImg = b.img;
  } catch (e) {
    console.error(e);
    data.rebrowse.push({ item_id: item.id, action: "error", error: e.message,
                         position: i, timestamp: nowISO(), tags: tagsOf(item.id) });
    return advanceRebrowse();
  }
  if (rebrowseOrder[i + 1]) preloadPair(rebrowseOrder[i + 1]);

  // Item sits on top of the prime; hiding the item reveals the prime.
  itemImg.style.visibility = "visible";
  stage.replaceChildren(...(primeImg ? [primeImg, itemImg] : [itemImg]));
  rebrowseT0 = await nextPaint();                        // item on screen; clock and flicker start
  if (primeImg) flicker = startFlicker(itemImg, primeImg, rebrowseT0);
  resetHover();
  acceptingInput = true;
}

function actRebrowse(action) {
  if (!acceptingInput) return;
  acceptingInput = false;
  const t = performance.now();
  const f = stopFlicker(t);
  const item = rebrowseOrder[rebrowseIndex];
  const first = data.browse.find(b => b.item_id === item.id);
  const dwell = Math.round(t - rebrowseT0);
  data.rebrowse.push({
    item_id: item.id,
    prime_id: item.prime ? item.prime.id : null,
    action,
    first_action: first ? first.action : null,
    changed: first ? first.action !== action : null,
    dwell_ms: dwell,                                     // from first appearance, flicker included
    speed: speedOf(dwell),
    ...hoverResult(),
    on_screen_at_choice: f ? f.showing : "item",         // which image was up when they chose
    item_visible_ms: f ? Math.round(f.itemMs) : dwell,
    prime_visible_ms: f ? Math.round(f.primeMs) : 0,
    switches: f ? f.switches : 0,
    position: rebrowseIndex,
    timestamp: nowISO(),
    tags: tagsOf(item.id),
    prime_tags: item.prime ? JSON.parse(JSON.stringify(item.prime.tags || {})) : null
  });
  backup("skipstudy_inprogress");
  advanceRebrowse();
}

function advanceRebrowse() {
  if (rebrowseIndex + 1 < rebrowseOrder.length) {
    $("browse-stage").replaceChildren();
    showRebrowseItem(rebrowseIndex + 1);
  } else {
    data.rebrowse_finished_at = nowISO();
    perf.rebrowse[1] = performance.now();
    finish();
  }
}

/* ============================================================
   3d. DISSECTION END PARTS
   Runs over the participant's skipped items, in a new random order.
   shown:  the object is taken apart automatically into shape, colour,
           pattern (if it has one) and an interesting element, laid out as a
           collage with lines back to where each element comes from.
   guided: the questions in GUIDED_QUESTIONS are asked one at a time; the
           participant circles the part with the mouse (any can be skipped)
           and may add a few words.
   free:   "find one detail you didn't notice": a few unnamed spheres.
   Afterwards the participant chooses keep or skip again.
   ============================================================ */
const dx = { mode: null, items: [], index: -1, cache: {}, deciding: false, busy: false };
const isLasso = () => dx.mode === "guided" || dx.mode === "refs";

// Pattern is only offered for objects that have one: "dissect": { "show_pattern": true } in catalogue.json.
const hasPattern = item => !item.dissect || item.dissect.show_pattern !== false;
const elementsFor = item => SHOWN_ELEMENTS.filter(e => e.key !== "pattern" || hasPattern(item));

const SHOWN_ELEMENTS = [
  { key: "shape",   label: "Shape",               side: "left"  },
  { key: "colour",  label: "Colour",              side: "left"  },
  { key: "pattern", label: "Pattern",             side: "right" },
  { key: "detail",  label: "Interesting element", side: "right" }
];

$("dissect-go").addEventListener("click", e => {
  e.currentTarget.blur();
  perf.dissect[0] = performance.now();
  data.dissect_started_at = nowISO();
  show("dissect");
  showDissectItem(0);
});
$("dissect-done").addEventListener("click", e => { e.currentTarget.blur(); enterDecision(); });
$("dissect-skip").addEventListener("click", e => { e.currentTarget.blur(); dissectDecide("skip"); });
$("dissect-keep").addEventListener("click", e => { e.currentTarget.blur(); dissectDecide("keep"); });
window.addEventListener("resize", () => { if (phase === "dissect" && dx.layout) dx.layout(); });

function startDissect(mode) {
  phase = "dissect";
  dx.mode = mode;
  data.dissect_mode = mode;
  data.dissect = [];
  const skipped = data.browse.filter(b => b.action === "skip").map(b => itemsById[b.item_id]);
  dx.items = shuffle(skipped);
  if (!dx.items.length) return finish();
  dx.items.forEach(it => preload(it));
  $("dissect-intro-text").textContent = DISSECT_INTRO[mode];
  $("ref-ready").textContent = "";
  if (mode === "refs") prepareReferences();
  show("dissect-intro");
  $("dissect-go").focus();
}

/* ---------- geometry helpers ---------- */

// Where the image actually sits inside its (square, object-fit: contain) stage, relative to `origin`.
function imgRect(stage, img, origin) {
  const s = stage.getBoundingClientRect(), o = origin.getBoundingClientRect();
  const k = Math.min(s.width / img.naturalWidth, s.height / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  return { left: s.left - o.left + (s.width - w) / 2, top: s.top - o.top + (s.height - h) / 2, width: w, height: h };
}
function relRect(el, origin) {
  const r = el.getBoundingClientRect(), o = origin.getBoundingClientRect();
  return { left: r.left - o.left, top: r.top - o.top, width: r.width, height: r.height,
           right: r.right - o.left, bottom: r.bottom - o.top };
}

/* ---------- automatic analysis (shown mode) ---------- */

// analyzeImage() lives in vision.js (shared with analysis.html).

// Fallback when the canvas can't be read: fixed crops, no silhouette/palette.
function fallbackAnalysis() {
  return { maskOk: false, unreadable: true, bbox: { x: 0, y: 0, w: 1, h: 1 },
           anchors: { shape: { x: 0.2, y: 0.4 }, colour: { x: 0.5, y: 0.6 } },
           pattern: { x: 0.5, y: 0.55, size: 0.22 }, detail: { x: 0.5, y: 0.22, size: 0.22 }, palette: [] };
}

/* ---------- tiles and connector lines ---------- */

function makeTile(side, caption) {
  const el = document.createElement("div");
  el.className = "tile";
  el.innerHTML = '<canvas></canvas><div class="txt"></div>';   // pictures only, no element names
  $(side === "left" ? "col-left" : "col-right").appendChild(el);
  return { el, canvas: el.querySelector("canvas"), txt: el.querySelector(".txt"), side };
}
function tileCtx(tile) {
  const r = tile.canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(r.width * dpr));
  if (tile.canvas.width !== W) { tile.canvas.width = W; tile.canvas.height = W; }
  const ctx = tile.canvas.getContext("2d");
  ctx.fillStyle = "#f4f4f4"; ctx.fillRect(0, 0, W, W);
  return { ctx, W };
}
// Draw a normalised region of a source (img or canvas) into the tile, letterboxed.
function drawRegion(tile, src, sw, sh, r) {
  const { ctx, W } = tileCtx(tile);
  const x = r.x * sw, y = r.y * sh, w = r.w * sw, h = r.h * sh;
  const k = Math.min(W / w, W / h) * 0.9;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, x, y, w, h, (W - w * k) / 2, (W - h * k) / 2, w * k, h * k);
}
// Square crop around a point: cx, cy normalised to the image; size normalised to its long side.
function drawCrop(tile, img, cx, cy, size) {
  const { ctx, W } = tileCtx(tile);
  const nw = img.naturalWidth, nh = img.naturalHeight, c = size * Math.max(nw, nh);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, cx * nw - c / 2, cy * nh - c / 2, c, c, 0, 0, W, W);
  return { ctx, W };
}
function drawText(tile, text) {
  const { ctx, W } = tileCtx(tile);
  ctx.fillStyle = "#555"; ctx.font = `${Math.round(W / 11)}px sans-serif`; ctx.textAlign = "center";
  ctx.fillText(text, W / 2, W / 2);
}
function drawPalette(tile, palette) {
  const { ctx, W } = tileCtx(tile);
  let y = 0;
  palette.forEach(p => { const h = p.share * W; ctx.fillStyle = p.hex; ctx.fillRect(0, y, W, Math.ceil(h)); y += h; });
}

// links: [{ tile, x, y (px in collage), r (px, optional), on }]
function drawLinks(links) {
  const svg = $("links"), NS = "http://www.w3.org/2000/svg", origin = $("collage");
  svg.replaceChildren();
  links.forEach(l => {
    const t = relRect(l.tile.canvas, origin);
    const ax = l.tile.side === "left" ? t.right : t.left, ay = t.top + t.height / 2;
    // End the line on the circle's edge when there is a circle.
    let ex = l.x, ey = l.y;
    if (l.r) { const d = Math.hypot(ax - l.x, ay - l.y) || 1; ex = l.x + (ax - l.x) / d * l.r; ey = l.y + (ay - l.y) / d * l.r; }
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", ax); line.setAttribute("y1", ay); line.setAttribute("x2", ex); line.setAttribute("y2", ey);
    const mark = document.createElementNS(NS, "circle");
    mark.setAttribute("cx", l.x); mark.setAttribute("cy", l.y);
    if (l.r) mark.setAttribute("r", l.r); else { mark.setAttribute("r", 4); mark.setAttribute("class", "dot"); }
    [line, mark].forEach(e => { e.style.opacity = l.on ? 1 : 0; svg.appendChild(e); });
  });
}

/* ---------- per item ---------- */

async function showDissectItem(i) {
  dx.index = i; dx.deciding = false; dx.busy = true; dx.debug = false; dx.layout = null;
  const item = dx.items[i];
  const collage = $("collage");
  collage.className = dx.mode === "refs" ? "guided refs" : dx.mode;
  $("lasso-panel").classList.remove("on");
  $("col-left").replaceChildren(); $("col-right").replaceChildren(); $("links").replaceChildren();
  collage.querySelectorAll(".sphere").forEach(s => s.remove());
  $("sphere-pop").hidden = true;
  $("dissect-prompt").textContent = DISSECT_PROMPT[dx.mode];
  $("dissect-done").hidden = false; $("dissect-done").disabled = false;
  $("dissect-skip").hidden = $("dissect-keep").hidden = true;
  window.scrollTo(0, 0);

  const { img } = await preload(item);
  img.style.visibility = "visible";
  $("dissect-stage").replaceChildren(img);
  dx.item = item; dx.img = img;

  dx.spheres = null;
  if (dx.mode === "shown") setupShown(item, img);
  else if (isLasso()) setupLasso(item, img);
  else setupSpheres(item, img);
  dx.layout();
  dx.t0 = await nextPaint();
  dx.busy = false;
}

function setupShown(item, img) {
  if (!dx.cache[item.id]) {
    const a = analyzeImage(img) || fallbackAnalysis();
    // Optional hand-picked crops in catalogue.json, e.g.
    // "dissect": { "pattern": {"x":0.5,"y":0.6,"size":0.2}, "detail": {"x":0.3,"y":0.2,"size":0.15} }
    if (item.dissect) ["pattern", "detail"].forEach(k => { if (item.dissect[k]) a[k] = { ...a[k], ...item.dissect[k], manual: true }; });
    dx.cache[item.id] = a;
  }
  const a = dx.cache[item.id];
  const tiles = {};
  const els = elementsFor(item);
  els.forEach(e => { tiles[e.key] = makeTile(e.side, e.label); });
  const on = new Set();
  dx.elements = a;

  dx.layout = () => {
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if (a.unreadable) { drawText(tiles.shape, "needs a server"); drawText(tiles.colour, "needs a server"); }
    else {
      if (a.maskOk) drawRegion(tiles.shape, a.shapeCv, a.shapeCv.width, a.shapeCv.height, a.bbox);
      else drawText(tiles.shape, "no clear outline");
      drawPalette(tiles.colour, a.palette);
    }
    if (tiles.pattern) drawCrop(tiles.pattern, img, a.pattern.x, a.pattern.y, a.pattern.size);
    drawCrop(tiles.detail, img, a.detail.x, a.detail.y, a.detail.size);

    const ir = imgRect($("dissect-stage"), img, $("collage"));
    const P = p => ({ x: ir.left + p.x * ir.width, y: ir.top + p.y * ir.height });
    const R = p => p.size * Math.max(ir.width, ir.height) / 2;
    drawLinks([
      { tile: tiles.shape,   ...P(a.anchors.shape),  on: on.has("shape") },
      { tile: tiles.colour,  ...P(a.anchors.colour), on: on.has("colour") },
      tiles.pattern && { tile: tiles.pattern, ...P(a.pattern), r: R(a.pattern), on: on.has("pattern") },
      { tile: tiles.detail,  ...P(a.detail),  r: R(a.detail),  on: on.has("detail") }
    ].filter(Boolean));
  };

  // Take the object apart one element at a time.
  els.forEach((e, n) => setTimeout(() => {
    if (dx.item !== item) return;
    on.add(e.key); tiles[e.key].el.classList.add("on"); dx.layout();
  }, 250 + n * 350));
  $("dissect-done").disabled = true;
  setTimeout(() => { if (dx.item === item) $("dissect-done").disabled = false; }, DISSECT_MIN_VIEW_MS);
}

function setupSpheres(item, img) {
  const defs = Array.from({ length: FREE_SPHERES }, (_, n) => ({ key: "detail_" + (n + 1), label: String(n + 1),
    question: "What is this detail?", side: n % 2 ? "right" : "left" }));
  const collage = $("collage");
  const spheres = defs.map(d => {
    const el = document.createElement("div");
    el.className = "sphere";
    if (dx.mode === "guided") { const l = document.createElement("span"); l.className = "lbl"; l.textContent = d.label; el.appendChild(l); }
    collage.appendChild(el);
    const tile = makeTile(d.side, dx.mode === "guided" ? d.label : "Detail " + d.label);
    tile.el.classList.add("on", "empty");
    return { key: d.key, label: d.label, question: d.question, el, tile, placed: false, x: null, y: null,
             text: "", moves: 0, removals: 0, first_placed_ms: null, selections: 0, drag: null };
  });
  dx.spheres = spheres;
  dx.selected = null;

  const D = () => parseFloat(getComputedStyle(collage).getPropertyValue("--sph")) || 84;
  // Tray slots spread across the full collage width, under the object.
  const trayPos = n => {
    const t = relRect($("tray"), collage), W = collage.clientWidth, gap = W * 0.7 / spheres.length;
    return { x: W * 0.15 + gap * (n + 0.5), y: t.top + D() / 2 + 8 };
  };
  const sizeSpheres = () => {
    const stageW = $("dissect-stage").getBoundingClientRect().width;
    collage.style.setProperty("--sph", Math.round(Math.max(56, Math.min(84, stageW * 0.28))) + "px");
  };

  function renderSphere(sp, cx, cy, ir) {
    sp.el.style.left = cx + "px"; sp.el.style.top = cy + "px";
    sp.el.classList.toggle("placed", sp.placed);
    const over = cx >= ir.left && cx <= ir.left + ir.width && cy >= ir.top && cy <= ir.top + ir.height;
    if (over && sp.drag) {                               // magnifier while aiming
      const Z = LENS_ZOOM, d = D();
      const bx = (cx - ir.left) * Z - d / 2, by = (cy - ir.top) * Z - d / 2;
      sp.el.style.background = `url("${item.image}") ${-bx}px ${-by}px / ${ir.width * Z}px ${ir.height * Z}px no-repeat, #ececec`;
    } else sp.el.style.background = "";
    return over;
  }

  function drawTile(sp, ir) {
    if (!sp.placed) { tileCtx(sp.tile); sp.tile.el.classList.add("empty"); sp.tile.txt.textContent = ""; return; }
    sp.tile.el.classList.remove("empty");
    const size = D() / LENS_ZOOM / Math.max(ir.width, ir.height);
    const { ctx, W } = drawCrop(sp.tile, img, sp.x, sp.y, size);
    sp.tile.txt.textContent = sp.text;
  }

  function placePop() {
    const pop = $("sphere-pop"), sp = dx.selected;
    if (!sp || !sp.placed || dx.deciding) { pop.hidden = true; return; }
    pop.hidden = false;
    const c = relRect(collage, collage), x = parseFloat(sp.el.style.left), y = parseFloat(sp.el.style.top), d = sp.el.offsetWidth;
    const right = x + d / 2 + 12 + 330 < c.width;
    pop.style.left = (right ? x + d / 2 + 12 : x - d / 2 - 12 - 330) + "px";
    pop.style.top = (y - 18) + "px";
    $("sphere-text").placeholder = sp.question;
    if ($("sphere-text").value !== sp.text) $("sphere-text").value = sp.text;
  }

  function select(sp) {
    spheres.forEach(s => s.el.classList.toggle("sel", s === sp));
    if (sp && dx.selected !== sp) sp.selections++;
    dx.selected = sp;
    placePop();
    if (sp && sp.placed) setTimeout(() => $("sphere-text").focus(), 0);
  }

  dx.layout = () => {
    sizeSpheres();
    const ir = imgRect($("dissect-stage"), img, collage);
    const links = [];
    spheres.forEach((sp, n) => {
      if (sp.drag) return;
      const p = sp.placed ? { x: ir.left + sp.x * ir.width, y: ir.top + sp.y * ir.height } : trayPos(n);
      renderSphere(sp, p.x, p.y, ir);
      drawTile(sp, ir);
      if (sp.placed) links.push({ tile: sp.tile, x: p.x, y: p.y, r: 14, on: true });
    });
    drawLinks(links);
    placePop();
  };

  spheres.forEach(sp => {
    sp.el.addEventListener("pointerdown", e => {
      if (dx.deciding) return;
      e.preventDefault();
      sp.el.setPointerCapture(e.pointerId);
      const x = parseFloat(sp.el.style.left), y = parseFloat(sp.el.style.top);
      sp.drag = { dx: e.clientX - x, dy: e.clientY - y, moved: false };
      sp.el.classList.add("dragging");
      select(sp);
    });
    sp.el.addEventListener("pointermove", e => {
      if (!sp.drag) return;
      const x = e.clientX - sp.drag.dx, y = e.clientY - sp.drag.dy;
      sp.drag.moved = true;
      renderSphere(sp, x, y, imgRect($("dissect-stage"), img, collage));
      $("sphere-pop").hidden = true;
    });
    const end = () => {
      if (!sp.drag) return;
      const moved = sp.drag.moved;
      sp.drag = null;
      sp.el.classList.remove("dragging");
      if (moved) {
        const ir = imgRect($("dissect-stage"), img, collage);
        const x = parseFloat(sp.el.style.left), y = parseFloat(sp.el.style.top);
        const over = x >= ir.left && x <= ir.left + ir.width && y >= ir.top && y <= ir.top + ir.height;
        sp.moves++;
        if (over) {
          sp.x = +((x - ir.left) / ir.width).toFixed(4); sp.y = +((y - ir.top) / ir.height).toFixed(4);
          if (!sp.placed && sp.first_placed_ms === null) sp.first_placed_ms = Math.round(performance.now() - dx.t0);
          sp.placed = true;
        } else { sp.placed = false; sp.x = sp.y = null; }
      }
      dx.layout();
      if (sp.placed) select(sp);
    };
    sp.el.addEventListener("pointerup", end);
    sp.el.addEventListener("pointercancel", end);
  });

  collage.onpointerdown = e => {
    if (!e.target.closest(".sphere") && !e.target.closest("#sphere-pop")) select(null);
  };
  // Remove: take the sphere off the object and back to the tray.
  $("sphere-remove").onclick = () => {
    const sp = dx.selected;
    if (!sp || dx.deciding) return;
    sp.placed = false; sp.x = sp.y = null; sp.text = ""; sp.removals++;
    $("sphere-text").value = "";
    select(null);
    dx.layout();
  };
  $("sphere-text").oninput = e => {
    if (!dx.selected) return;
    dx.selected.text = e.target.value;
    dx.selected.tile.txt.textContent = e.target.value;
  };
}

/* ---------- guided: circle each answer with the mouse, one question at a time ---------- */

// Polygon area (shoelace), for points normalised to the image.
function polyArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  return Math.abs(a / 2);
}
// Keep exported paths small: drop points closer than `min` to the previous kept one.
function thin(pts, min) {
  const out = [pts[0]];
  for (const p of pts) { const q = out[out.length - 1]; if (Math.hypot(p.x - q.x, p.y - q.y) >= min) out.push(p); }
  return out;
}

function setupLasso(item, img) {
  const stage = $("dissect-stage"), collage = $("collage");
  const cv = document.createElement("canvas");
  cv.id = "lasso-canvas";
  stage.appendChild(cv);
  dx.questions = GUIDED_QUESTIONS.map(q => ({
    ...q, tile: makeTile(q.side, q.label), path: null, bbox: null, area: null,
    text: "", redraws: 0, first_stroke_ms: null, time_ms: 0,
    refs: null, refsText: "", opened: [], part: null, words: null, explore_opens: 0
  }));
  const withRefs = dx.mode === "refs" && dx.refsReady;
  $("ref-strip").classList.toggle("on", dx.mode === "refs");

  let qi = 0, qStart = 0, drawing = null;
  $("dissect-done").hidden = true;
  $("lasso-panel").classList.add("on");

  const ir = () => imgRect(stage, img, stage);       // image rect inside the stage
  const toNorm = e => {
    const s = stage.getBoundingClientRect(), r = ir();
    return { x: Math.min(1, Math.max(0, (e.clientX - s.left - r.left) / r.width)),
             y: Math.min(1, Math.max(0, (e.clientY - s.top - r.top) / r.height)) };
  };

  function tracePath(ctx, pts, r, d) {
    ctx.beginPath();
    pts.forEach((p, n) => { const x = (r.left + p.x * r.width) * d, y = (r.top + p.y * r.height) * d; n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  }

  function drawOverlay() {
    const s = stage.getBoundingClientRect(), d = window.devicePixelRatio || 1, r = ir();
    cv.width = Math.round(s.width * d); cv.height = Math.round(s.height * d);
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    dx.questions.forEach((q, n) => {
      const pts = n === qi && drawing ? drawing : q.path;
      if (!pts || pts.length < 2) return;
      tracePath(ctx, pts, r, d);
      if (!(n === qi && drawing)) ctx.closePath();
      const current = n === qi;
      ctx.lineJoin = "round";
      ctx.lineWidth = (current ? 3 : 2) * d;
      ctx.setLineDash(current ? [] : [5 * d, 4 * d]);
      ctx.strokeStyle = current ? "#fbe36b" : "rgba(255,255,255,.85)";
      if (!(n === qi && drawing)) { ctx.fillStyle = current ? "rgba(251,227,107,.18)" : "rgba(255,255,255,.08)"; ctx.fill(); }
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 3 * d;
      ctx.stroke();
      ctx.shadowBlur = 0; ctx.setLineDash([]);
    });
  }

  // Tile: crop around the circled area, with everything outside the circle dimmed.
  function drawTileFor(q) {
    if (!q.path) { tileCtx(q.tile); q.tile.el.classList.add("empty"); q.tile.txt.textContent = ""; return; }
    q.tile.el.classList.remove("empty");
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const b = q.bbox, side = Math.max(b.w * nw, b.h * nh) * 1.15;
    const cx = (b.x + b.w / 2) * nw, cy = (b.y + b.h / 2) * nh;
    const { ctx, W } = tileCtx(q.tile);
    const k = W / side, ox = cx - side / 2, oy = cy - side / 2;
    ctx.drawImage(img, ox, oy, side, side, 0, 0, W, W);
    ctx.beginPath();
    ctx.rect(0, 0, W, W);
    q.path.forEach((p, n) => { const x = (p.x * nw - ox) * k, y = (p.y * nh - oy) * k; n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    ctx.fillStyle = "rgba(20,20,20,.55)";
    ctx.fill("evenodd");
    q.tile.txt.textContent = q.text;
  }

  dx.layout = () => {
    drawOverlay();
    const r = imgRect(stage, img, collage), links = [];
    dx.questions.forEach(q => {
      drawTileFor(q);
      q.tile.el.classList.add("on");
      if (q.path) links.push({ tile: q.tile, x: r.left + (q.bbox.x + q.bbox.w / 2) * r.width,
                               y: r.top + (q.bbox.y + q.bbox.h / 2) * r.height, on: true });
    });
    drawLinks(links);
  };

  function showQuestion() {
    const q = dx.questions[qi];
    $("dissect-prompt").textContent = "";
    const step = document.createElement("span"); step.className = "q-step";
    step.textContent = `${qi + 1} of ${dx.questions.length}  ·  ${DISSECT_PROMPT[dx.mode]}`;
    const text = document.createElement("span"); text.className = "q-text"; text.textContent = q.question;
    $("lasso-ask").replaceChildren(text, step);
    $("lasso-text").value = q.text;
    $("lasso-next").textContent = qi === dx.questions.length - 1 ? "Done" : "Next";
    if (dx.mode === "refs") renderRefs(q);
    qStart = performance.now();
    dx.layout();
  }

  stage.onpointerdown = e => {
    if (dx.deciding || dx.busy) return;
    e.preventDefault();
    stage.setPointerCapture(e.pointerId);
    const q = dx.questions[qi];
    if (q.first_stroke_ms === null) q.first_stroke_ms = Math.round(performance.now() - qStart);
    drawing = [toNorm(e)];
    drawOverlay();
  };
  stage.onpointermove = e => {
    if (!drawing) return;
    drawing.push(toNorm(e));
    drawOverlay();
  };
  stage.onpointerup = stage.onpointercancel = () => {
    if (!drawing) return;
    const pts = thin(drawing, 0.004);
    drawing = null;
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const bbox = { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
    if (pts.length >= 4 && Math.max(bbox.w, bbox.h) > 0.02) {   // ignore clicks and tiny scribbles
      const q = dx.questions[qi];
      if (q.path) q.redraws++;
      q.path = pts;
      q.bbox = { x: +bbox.x.toFixed(4), y: +bbox.y.toFixed(4), w: +bbox.w.toFixed(4), h: +bbox.h.toFixed(4) };
      q.area = +polyArea(pts).toFixed(4);
      if (withRefs) findRefs(q, true);
    }
    dx.layout();
  };
  let textTimer = null;
  $("lasso-text").oninput = e => {
    const q = dx.questions[qi]; q.text = e.target.value; q.tile.txt.textContent = q.text;
    if (withRefs && q.path) { clearTimeout(textTimer); textTimer = setTimeout(() => findRefs(q, false), 600); }
  };
  $("lasso-clear").onclick = e => {
    e.currentTarget.blur();
    const q = dx.questions[qi];
    if (q.path) q.redraws++;
    q.path = q.bbox = q.area = null;
    q.refs = null; q.part = null; q.words = null;
    if (dx.mode === "refs") renderRefs(q);
    dx.layout();
  };
  $("lasso-next").onclick = e => {
    e.currentTarget.blur();
    const q = dx.questions[qi];
    q.time_ms += Math.round(performance.now() - qStart);
    if (qi < dx.questions.length - 1) { qi++; showQuestion(); }
    else { $("lasso-panel").classList.remove("on"); stage.onpointerdown = null; enterDecision(); }
  };
  dx.lassoNext = () => $("lasso-next").click();
  showQuestion();
}

/* ---------- Circle + references (references.js) ---------- */

let refsLib = null;
function prepareReferences() {
  dx.refsReady = false;
  $("dissect-go").disabled = true;
  $("ref-ready").textContent = "Preparing…";
  const fallback = setTimeout(() => {                    // don't hold the participant up forever
    $("dissect-go").disabled = false;
  }, 60000);
  import("./references.js").then(lib => {
    refsLib = lib;
    return lib.loadReferences(f => { $("ref-ready").textContent = `Preparing… ${Math.round(f * 100)}%`; });
  }).then(info => {
    dx.refsReady = true;
    data.references_model = info;
    $("ref-ready").textContent = "";
  }).catch(err => {
    console.error(err);
    data.references_error = String(err.message || err);
    $("ref-ready").textContent = "";
  }).finally(() => { clearTimeout(fallback); $("dissect-go").disabled = false; });
}

// What CLIP sees: the circled part, cropped square, with everything outside the circle greyed out.
function cropForClip(img, q) {
  const nw = img.naturalWidth, nh = img.naturalHeight, b = q.bbox;
  const side = Math.max(b.w * nw, b.h * nh) * 1.1, cx = (b.x + b.w / 2) * nw, cy = (b.y + b.h / 2) * nh;
  const ox = cx - side / 2, oy = cy - side / 2, W = 224, k = W / side;
  const cv = document.createElement("canvas"); cv.width = cv.height = W;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, W);
  ctx.save();
  ctx.beginPath();
  q.path.forEach((p, n) => { const x = (p.x * nw - ox) * k, y = (p.y * nh - oy) * k; n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.clip();
  ctx.drawImage(img, ox, oy, side, side, 0, 0, W, W);
  ctx.restore();
  return cv;
}

// The circled part on a transparent background, for the explorer.
function cutout(img, q, W = 360) {
  const nw = img.naturalWidth, nh = img.naturalHeight, b = q.bbox;
  const side = Math.max(b.w * nw, b.h * nh) * 1.05, cx = (b.x + b.w / 2) * nw, cy = (b.y + b.h / 2) * nh;
  const ox = cx - side / 2, oy = cy - side / 2, k = W / side;
  const cv = document.createElement("canvas"); cv.width = cv.height = W;
  const ctx = cv.getContext("2d");
  ctx.beginPath();
  q.path.forEach((p, n) => { const x = (p.x * nw - ox) * k, y = (p.y * nh - oy) * k; n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.save(); ctx.clip(); ctx.drawImage(img, ox, oy, side, side, 0, 0, W, W); ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = "#fbe36b"; ctx.stroke();
  return cv;
}

async function findRefs(q, newCircle) {
  const token = (q.refToken = (q.refToken || 0) + 1);
  q.refs = null;
  if (dx.currentQuestion === q) renderRefs(q);
  try {
    if (newCircle || !q.part) q.part = await refsLib.embedPart(cropForClip(dx.img, q));
    const typed = q.text.trim() || null;
    const res = await refsLib.findReferences(q.part, {
      typed, k: REFS_COUNT,
      onWords: words => {
        if (token !== q.refToken) return;
        q.words = words;
        if (dx.currentQuestion === q) renderRefs(q);
      },
      onPartial: (results, words) => {                   // show results as each search returns
        if (token !== q.refToken) return;
        q.refs = results; q.words = words;
        if (dx.currentQuestion === q) renderRefs(q);
      }
    });
    if (token !== q.refToken) return;                    // a newer circle or edit superseded this one
    q.refs = res.results; q.words = res.words; q.refsText = typed || "";
    q.refsOffline = res.offline;
  } catch (e) {
    console.error(e);
    if (token === q.refToken) q.refs = [];
  }
  if (dx.currentQuestion === q) renderRefs(q);
}

function renderRefs(q) {
  dx.currentQuestion = q;
  const list = $("ref-list"), head = $("ref-head");
  list.replaceChildren(); head.replaceChildren();
  if (!dx.refsReady) { $("ref-status").textContent = q.path ? "References are unavailable right now." : ""; return; }
  if (!q.path) { $("ref-status").textContent = "Circle a part to see what it might connect to."; return; }
  if (q.refs) $("ref-status").textContent = q.refs.length ? "" : "Nothing found — try circling a different part or adding words.";
  else $("ref-status").textContent = "Finding images…";
  if (q.words && q.words.length) {
    const label = document.createElement("span"); label.textContent = REFS_HEADING;
    head.appendChild(label);
    q.words.forEach(w => {
      const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = w;
      c.onclick = () => { if (q.refs && q.refs.length) openExplorer(q, 0, w); };
      head.appendChild(c);
    });
  }
  (q.refs || []).forEach((r, n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "ref"; b.title = r.title;
    const im = new Image(); im.src = r.image; im.alt = "";
    b.appendChild(im);
    b.onclick = () => openExplorer(q, n);
    list.appendChild(b);
  });
}

/* ---------- explorer ---------- */
const ex = { q: null, list: [], i: 0, word: null, shownAt: 0, front: "ex-a" };

function openExplorer(q, i, word = null) {
  ex.q = q; ex.word = word;
  ex.list = word ? q.refs.filter(r => r.word === word) : q.refs.slice();
  if (!ex.list.length) ex.list = q.refs.slice();
  ex.i = Math.min(i, ex.list.length - 1);
  q.explore_opens = (q.explore_opens || 0) + 1;
  const part = cutout(dx.img, q), pc = $("ex-part");
  pc.width = part.width; pc.height = part.height; pc.getContext("2d").drawImage(part, 0, 0);
  const words = $("ex-words"); words.replaceChildren();
  (q.words || []).forEach(w => {
    const c = document.createElement("button"); c.type = "button"; c.className = "chip" + (w === word ? " on" : "");
    c.textContent = w;
    c.onclick = () => { logView(); openExplorer(q, 0, w === ex.word ? null : w); };
    words.appendChild(c);
  });
  $("explore").hidden = false;
  showExplore();
}
function logView() {
  if (!ex.q || !ex.shown) return;
  ex.q.opened.push({ id: ex.shown.id, word: ex.shown.word, view_ms: Math.round(performance.now() - ex.shownAt) });
  ex.shown = null;
}
function showExplore() {
  logView();
  const r = ex.list[ex.i];
  if (!r) return;
  const back = ex.front === "ex-a" ? "ex-b" : "ex-a";
  const im = $(back);
  im.style.opacity = 0;
  im.onload = () => { im.style.opacity = 1; $(ex.front).style.opacity = 0; ex.front = back; };
  im.src = r.full || r.image;
  im.onerror = () => { im.onerror = null; im.src = r.image; };     // fall back to the thumbnail
  $("ex-title").textContent = r.title;
  $("ex-meta").textContent = [r.creator, r.word && `“${r.word}”`].filter(Boolean).join(" · ");
  $("ex-lic").textContent = r.source === "Openverse" ? `${(r.license || "").toUpperCase()} · via Openverse` : (r.source || "");
  $("ex-count").textContent = `${ex.i + 1} / ${ex.list.length}`;
  ex.shown = r; ex.shownAt = performance.now();
}
function closeExplorer() { logView(); $("explore").hidden = true; }
$("ex-prev").onclick = () => { ex.i = (ex.i - 1 + ex.list.length) % ex.list.length; showExplore(); };
$("ex-next").onclick = () => { ex.i = (ex.i + 1) % ex.list.length; showExplore(); };
$("ex-back").onclick = closeExplorer;
document.addEventListener("keydown", e => {
  if ($("explore").hidden) return;
  if (e.key === "Escape") closeExplorer();
  if (e.key === "ArrowRight") { e.stopPropagation(); $("ex-next").click(); }
  if (e.key === "ArrowLeft") { e.stopPropagation(); $("ex-prev").click(); }
}, true);

async function enterDecision() {
  if (dx.deciding || dx.busy) return;
  dx.activity_ms = Math.round(performance.now() - dx.t0);
  $("sphere-pop").hidden = true;
  $("collage").classList.add("locked");
  (dx.spheres || []).forEach(s => s.el.classList.remove("sel"));
  $("dissect-prompt").textContent = DISSECT_DECIDE_PROMPT;
  $("dissect-done").hidden = true;
  $("dissect-skip").hidden = $("dissect-keep").hidden = false;
  dx.decisionT0 = await nextPaint();
  dx.deciding = true;
}

function dissectDecide(action) {
  if (!dx.deciding) return;
  dx.deciding = false;
  const dwell = Math.round(performance.now() - dx.decisionT0);
  const item = dx.item;
  const first = data.browse.find(b => b.item_id === item.id);
  const entry = {
    item_id: item.id,
    mode: dx.mode,
    action,
    first_action: first ? first.action : null,
    changed: first ? first.action !== action : null,
    activity_ms: dx.activity_ms,                 // time looking at / working on the dissection
    dwell_ms: dwell,                             // time from keep/skip appearing to the choice
    speed: speedOf(dwell),
    position: dx.index,
    timestamp: nowISO(),
    tags: tagsOf(item.id)
  };
  if (dx.mode === "shown") {
    const a = dx.cache[item.id];
    entry.elements = {
      outline_found: a.maskOk, canvas_readable: !a.unreadable,
      bbox: a.bbox, pattern: hasPattern(item) ? a.pattern : null, detail: a.detail,
      colour_palette: a.palette.map(p => ({ hex: p.hex, share: p.share }))
    };
  } else if (isLasso()) {
    entry.questions = dx.questions.map(q => ({
      key: q.key, question: q.question, selected: !!q.path,
      path: q.path ? q.path.map(p => [+p.x.toFixed(4), +p.y.toFixed(4)]) : null,   // normalised to the image
      bbox: q.bbox, area: q.area, text: q.text, text_blank: q.text.trim() === "",
      redraws: q.redraws, first_stroke_ms: q.first_stroke_ms, time_ms: q.time_ms,
      ...(dx.mode === "refs" ? {
        reads_like: q.words,
        references: (q.refs || []).map(r => ({ id: r.id, word: r.word, title: r.title, source: r.source,
                                              url: r.landing || r.url || "", score: r.score,
                                              shape_sim: r.shape_sim })),
        references_used_text: !!(q.refs && q.refsText),
        references_offline: !!q.refsOffline,
        explore_opens: q.explore_opens,
        references_viewed: q.opened
      } : {})
    }));
    entry.selected_count = dx.questions.filter(q => q.path).length;
  } else {
    entry.spheres = dx.spheres.map(s => ({
      key: s.key, question: s.question, placed: s.placed, x: s.x, y: s.y,
      text: s.text, text_blank: s.text.trim() === "",
      moves: s.moves, removals: s.removals, first_placed_ms: s.first_placed_ms, selections: s.selections
    }));
    entry.placed_count = dx.spheres.filter(s => s.placed).length;
  }
  if (dx.debug || action === "debug") entry.debug = true;
  data.dissect.push(entry);
  backup("skipstudy_inprogress");
  $("collage").classList.remove("locked");
  if (dx.index + 1 < dx.items.length) showDissectItem(dx.index + 1);
  else {
    perf.dissect[1] = performance.now();
    data.dissect_finished_at = nowISO();
    finish();
  }
}

/* ============================================================
   4. END
   ============================================================ */
let exportName = "";
let exportJSON = "";

function backup(key) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { console.warn(e); }
}

function dwellStats(entries) {
  const ms = entries.map(e => e.dwell_ms).sort((a, b) => a - b);
  if (!ms.length) return { n: 0 };
  const mid = Math.floor(ms.length / 2);
  return {
    n: ms.length,
    mean_ms: Math.round(ms.reduce((a, b) => a + b, 0) / ms.length),
    median_ms: ms.length % 2 ? ms[mid] : Math.round((ms[mid - 1] + ms[mid]) / 2),
    min_ms: ms[0],
    max_ms: ms[ms.length - 1],
    total_ms: ms.reduce((a, b) => a + b, 0)
  };
}
function roundSummary(entries) {
  const ok = entries.filter(e => e.action === "keep" || e.action === "skip");
  const s = {
    keep: dwellStats(ok.filter(e => e.action === "keep")),
    skip: dwellStats(ok.filter(e => e.action === "skip")),
    glance_count: ok.filter(e => e.speed === "glance").length,
    lingered_count: ok.filter(e => e.speed === "lingered").length,
    lingered_items: ok.filter(e => e.speed === "lingered").map(e => e.item_id),
    total_hover_skip_ms: ok.reduce((a, e) => a + (e.hover_skip_ms || 0), 0),
    total_hover_keep_ms: ok.reduce((a, e) => a + (e.hover_keep_ms || 0), 0),
    hesitations: ok.filter(e => e.hover_switches > 0).length
  };
  if (ok.length && "changed" in ok[0]) s.changed_count = ok.filter(e => e.changed).length;
  return s;
}
const span = ([a, b]) => (a && b ? Math.round(b - a) : null);

function finish() {
  phase = "end";
  data.finished_at = nowISO();
  clearInterval(timerInterval);
  data.timings = {
    session_ms: Math.round(performance.now() - perf.session),
    browse_ms: span(perf.browse),
    replay_ms: span(perf.replay),
    rebrowse_ms: span(perf.rebrowse),
    dissect_ms: span(perf.dissect),
    glance_threshold_ms: GLANCE_MS,
    linger_threshold_ms: LINGER_MS
  };
  data.summary = { browse: roundSummary(data.browse), rebrowse: roundSummary(data.rebrowse) };
  if (data.dissect) data.summary.dissect = roundSummary(data.dissect);
  const stamp = data.finished_at.replace(/[:.]/g, "-");
  exportName = `${participantId}_${stamp}.json`;
  exportJSON = JSON.stringify(data, null, 2);
  try {
    localStorage.setItem("skipstudy_" + exportName, exportJSON);
    localStorage.removeItem("skipstudy_inprogress");
    $("saved-note").textContent = "A backup copy has also been saved in this browser.";
  } catch (e) {
    $("saved-note").textContent = "Note: browser backup failed — please download the file.";
  }
  $("thanks").textContent = THANKS;
  show("end");
}

/* ============================================================
   END PARTS: what runs after replay. Chosen in Settings.
   To add a version: write a start function that calls finish() when done,
   then add it here.
   ============================================================ */
const END_PARTS = {
  off:     { label: "Off", start: () => finish() },
  flicker: { label: "Flicker with references", start: () => startRebrowseIntro() },
  dissect_shown:  { label: "Dissection – shown", start: () => startDissect("shown") },
  dissect_guided: { label: "Dissection – you label it", start: () => startDissect("guided") },
  dissect_free:   { label: "Dissection – find a detail", start: () => startDissect("free") },
  dissect_refs:   { label: "Circle + references", start: () => startDissect("refs") }
};
function startEndPart() {
  (END_PARTS[settings.endPart] || END_PARTS.off).start();
}

/* ============================================================
   SETTINGS PANEL
   ============================================================ */
const SETTINGS_KEY = "skipstudy_settings";
let settings = { ...DEFAULT_SETTINGS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (e) {}
if (!END_PARTS[settings.endPart]) settings.endPart = "off";

function applySettings() {
  $("debug-bar").style.display = settings.debug ? "flex" : "none";
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}
Object.entries(END_PARTS).forEach(([key, part]) => $("set-end").add(new Option(part.label, key)));
$("set-end").value = settings.endPart;
$("set-count").value = settings.itemCount || "";
$("set-count").placeholder = "all";
$("set-timer").checked = settings.showTimer;
$("set-debug").checked = settings.debug;
function countNote() {
  const total = catalogue ? catalogue.items.length : "?";
  $("set-count-note").textContent = `Blank = all ${total} items. Otherwise a random subset.`;
}
countNote();

$("settings-btn").addEventListener("click", e => {
  e.currentTarget.blur();
  countNote();
  $("settings-panel").hidden = !$("settings-panel").hidden;
});
$("set-end").addEventListener("change", e => { settings.endPart = e.target.value; applySettings(); });
$("set-count").addEventListener("input", e => {
  settings.itemCount = Math.max(0, parseInt(e.target.value, 10) || 0); applySettings();
});
$("set-timer").addEventListener("change", e => { settings.showTimer = e.target.checked; applySettings(); });
$("set-debug").addEventListener("change", e => { settings.debug = e.target.checked; applySettings(); });
applySettings();

/* ============================================================
   DEBUG: advance one page (one screen or one item). Browse and re-browse
   items are logged with action "debug"; replay items with debug: true.
   Every click is also listed in data.debug_skips.
   ============================================================ */

$("debug-skip").addEventListener("click", e => {
  e.currentTarget.blur();
  const screen = document.querySelector(".screen.active").id;
  if (screen === "end") return;
  (data.debug_skips = data.debug_skips || []).push({ phase, screen, timestamp: nowISO() });
  if (screen === "start") $("start-btn").click();
  else if (screen === "replay-intro") $("replay-go").click();
  else if (screen === "rebrowse-intro") $("rebrowse-go").click();
  else if (screen === "dissect-intro") $("dissect-go").click();
  else if (screen === "dissect") {
    if (dx.deciding) dissectDecide("debug");
    else if (!dx.busy) {
      dx.debug = true;
      if (isLasso() && $("lasso-panel").classList.contains("on")) dx.lassoNext();  // next question
      else enterDecision();
    }
  }
  else if (screen === "browse") act("debug");
  else if (screen === "replay") {
    clearTimeout(revealTimer);
    $("replay-controls").classList.add("shown", "visible");
    debugReplayNext = true;
    $("replay-next").click();
  }
});
let debugReplayNext = false;

// Skip the rest of the current stage: browse → replay → end part → end.
$("debug-stage").addEventListener("click", e => {
  e.currentTarget.blur();
  const screen = document.querySelector(".screen.active").id;
  if (screen === "end") return;
  (data.debug_skips = data.debug_skips || []).push({ phase, screen, stage: true, timestamp: nowISO() });
  acceptingInput = false;
  if (phase === "start") $("start-btn").click();
  else if (phase === "browse") {
    data.browse_finished_at = nowISO();
    data.total_browse_ms = Math.round(performance.now() - browseStartPerf);
    perf.browse = [browseStartPerf, performance.now()];
    startReplayIntro();
  } else if (phase === "replay") {
    clearTimeout(revealTimer);
    if (perf.replay[0]) perf.replay[1] = performance.now();
    startEndPart();
  } else if (phase === "rebrowse") {
    stopFlicker(performance.now());
    data.rebrowse_finished_at = nowISO();
    if (perf.rebrowse[0]) perf.rebrowse[1] = performance.now();
    finish();
  } else if (phase === "dissect") {
    dx.deciding = false; dx.item = null;
    if (perf.dissect[0]) perf.dissect[1] = performance.now();
    data.dissect_finished_at = nowISO();
    finish();
  }
});

$("download-btn").addEventListener("click", () => {
  const blob = new Blob([exportJSON], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = exportName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
